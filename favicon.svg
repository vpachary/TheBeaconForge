<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background Circle with deep bronze/obsidian tone -->
  <rect width="64" height="64" rx="14" fill="#0E0F12"/>
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#D4AF37" stroke-opacity="0.25" stroke-width="1.5"/>
  
  <!-- Beacon Light Rays -->
  <path d="M32 10 L38 24 L26 24 Z" fill="url(#beacon-light)" opacity="0.8"/>
  <line x1="32" y1="8" x2="32" y2="4" stroke="#E5C386" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="12" x2="16" y2="9" stroke="#E5C386" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="44" y1="12" x2="48" y2="9" stroke="#E5C386" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Central Beacon Prism / Flame -->
  <polygon points="32,16 38,28 26,28" fill="#F4D088"/>
  <circle cx="32" cy="24" r="3" fill="#FFF8EB"/>
  
  <!-- The Forge Anvil / Pedestal -->
  <path d="M22 34 H42 L40 40 H24 Z" fill="#C89666" stroke="#E5C386" stroke-width="1"/>
  <path d="M20 40 H44 L46 50 H18 Z" fill="#202227" stroke="#D4AF37" stroke-width="1.2"/>
  <line x1="16" y1="52" x2="48" y2="52" stroke="#E5C386" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Ember Spark -->
  <circle cx="43" cy="20" r="1" fill="#FFB74D"/>
  <circle cx="21" cy="22" r="0.8" fill="#FFD54F"/>

  <defs>
    <linearGradient id="beacon-light" x1="32" y1="10" x2="32" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF3D6" stop-opacity="0.9"/>
      <stop stop-color="#E5C386" stop-opacity="0.3"/>
      <stop stop-color="#0E0F12" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
